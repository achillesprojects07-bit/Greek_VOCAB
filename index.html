<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Λέξεις — Greek words &amp; phrases</title>
<meta name="theme-color" content="#E6E3DA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --stone:#E6E3DA;
  --card:#F3F1EA;
  --ink:#1B2A30;
  --ink-2:#5A6A70;
  --line:#CFCBBF;
  --m:#B0552A;      /* ο  masculine */
  --f:#2E7D6B;      /* η  feminine  */
  --n:#7A5C8E;      /* το neuter    */
  --ok:#2E7D6B;
  --no:#B0552A;
  --serif:"Alegreya","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;
  padding:0 18px calc(28px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--f);outline-offset:2px;border-radius:2px}

/* ---------- header ---------- */
header{display:flex;align-items:baseline;gap:12px;padding:22px 0 14px}
.mark{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:.01em}
.mark span{color:var(--f)}
.due{margin-left:auto;font-size:13px;color:var(--ink-2)}
.due b{color:var(--ink);font-weight:600}

.back{font-size:14px;color:var(--ink-2);padding:6px 0;display:inline-block}
.back:hover{color:var(--ink)}

h1{font-family:var(--serif);font-size:29px;font-weight:400;line-height:1.25;margin:6px 0 4px}
h2{font-family:var(--serif);font-size:22px;font-weight:500;margin:26px 0 10px}
.sub{color:var(--ink-2);font-size:14.5px;margin:0 0 20px}

/* ---------- home ---------- */
.menu{display:grid;gap:10px;margin-top:18px}
.tile{
  display:flex;align-items:baseline;gap:14px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:15px 16px;
}
.tile:hover{border-color:var(--ink-2)}
.tile .gr{font-family:var(--serif);font-size:22px;min-width:118px}
.tile .en{font-size:14px;color:var(--ink-2)}
.tile .n{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tile.hot{border-color:var(--f);border-left-width:4px}

/* ---------- lists ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink-2);background:var(--card)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
input[type=search]{
  width:100%;font:inherit;padding:10px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:3px;color:var(--ink);
}
input[type=search]::placeholder{color:var(--ink-2)}

.item{border-bottom:1px solid var(--line);padding:13px 0;cursor:pointer;display:block;width:100%;text-align:left}
.item:last-child{border-bottom:none}
.gr{font-family:var(--serif);font-size:21px;line-height:1.3}
.art{font-weight:400}
.m .art{color:var(--m)} .f .art{color:var(--f)} .n .art{color:var(--n)}
.en{font-size:14.5px;color:var(--ink-2);margin-top:1px}
.detail{margin-top:9px;padding:11px 13px;background:var(--card);border-left:3px solid var(--line);border-radius:0 3px 3px 0}
.detail .exgr{font-family:var(--serif);font-size:18px}
.detail .exen{font-size:14px;color:var(--ink-2);margin-top:2px}
.pos{font-size:12px;color:var(--ink-2);margin-top:8px}
.speak{font-size:13px;color:var(--f);border:1px solid var(--line);border-radius:999px;padding:3px 11px;margin-top:10px;background:var(--stone)}

/* ---------- study card ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:30px 22px;text-align:center;min-height:210px;
  display:flex;flex-direction:column;justify-content:center;gap:8px;margin-top:16px;
}
.card .prompt{font-size:15px;color:var(--ink-2)}
.card .big{font-family:var(--serif);font-size:36px;line-height:1.2}
.card .bigen{font-family:var(--sans);font-size:26px;font-weight:500;line-height:1.25}
.card .ex{font-family:var(--serif);font-size:18px;color:var(--ink-2);margin-top:10px}
.reveal{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}

.actions{display:grid;gap:9px;margin-top:14px}
.two{grid-template-columns:1fr 1fr}
.btn{border:1px solid var(--ink);border-radius:3px;padding:13px;font-size:15px;background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.good{border-color:var(--ok);color:var(--ok);background:transparent}
.btn.again{border-color:var(--no);color:var(--no);background:transparent}
.choices{display:grid;gap:9px;margin-top:14px}
.choice{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:13px 15px;text-align:left;font-size:16px}
.choice.right{border-color:var(--ok);color:var(--ok)}
.choice.wrong{border-color:var(--no);color:var(--no)}
.counter{font-size:13px;color:var(--ink-2);text-align:center;margin-top:14px;font-variant-numeric:tabular-nums}

/* ---------- patterns ---------- */
.pat{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:15px 16px;margin-bottom:11px}
.pat .form{font-family:var(--serif);font-size:23px}
.slot{border-bottom:2px dotted var(--f);padding:0 16px}
.pat ul{margin:11px 0 0;padding-left:18px}
.pat li{font-family:var(--serif);font-size:18px;margin-bottom:5px}
.pat li small{font-family:var(--sans);font-size:13.5px;color:var(--ink-2);display:block}

/* ---------- progress ---------- */
.bar{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--f)}
.row{margin-bottom:16px}
.row .lab{display:flex;justify-content:space-between;font-size:14.5px}
.row .lab b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.legend{display:flex;gap:16px;font-size:13.5px;color:var(--ink-2);margin:18px 0 4px;flex-wrap:wrap}
.legend b{font-family:var(--serif);font-size:17px}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.empty{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:22px;text-align:center;color:var(--ink-2);font-size:15px}
</style>
</head>

const ALL = WORDS.concat(PHRASES);
const BY_ID = {}; ALL.forEach(x=>BY_ID[x.id]=x);

// storage that survives everywhere: localStorage if allowed, memory if not
const store = (()=>{
  let mem={};
  const key="lexeis.v1";
  let ok=true;
  try{ localStorage.setItem("_t","1"); localStorage.removeItem("_t"); }catch(e){ ok=false; }
  return {
    load(){ if(!ok) return mem;
      try{ return JSON.parse(localStorage.getItem(key)||"{}"); }catch(e){ return {}; } },
    save(d){ mem=d; if(!ok) return;
      try{ localStorage.setItem(key,JSON.stringify(d)); }catch(e){} },
    ok
  };
})();

let P = store.load();                 // {id:{box,due,right,wrong}}
const save = ()=>store.save(P);

const DAY = 86400000;
const STEPS = [0, 1, 2, 4, 8, 16, 32, 64];   // days until next review, by box
const now = ()=>Date.now();

function rec(id){ return P[id] || {box:0,due:0,right:0,wrong:0}; }
function seen(id){ return !!P[id]; }
function grade(id,good){
  const r = rec(id);
  r.box = good ? Math.min(r.box+1, STEPS.length-1) : 1;
  if(good) r.right++; else r.wrong++;
  r.due = now() + STEPS[r.box]*DAY;
  P[id]=r; save();
}
function dueList(){
  return ALL.filter(x=> seen(x.id) && rec(x.id).due <= now());
}
function newList(n){
  return ALL.filter(x=> !seen(x.id)).slice(0,n);
}
function mastered(id){ return rec(id).box >= 5; }

// speech
let voice=null;
function pickVoice(){
  const vs = (window.speechSynthesis && speechSynthesis.getVoices) ? speechSynthesis.getVoices() : [];
  voice = vs.find(v=>/^el/i.test(v.lang)) || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="el-GR"; if(voice) u.voice=voice; u.rate=0.85;
  speechSynthesis.speak(u);
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

// full Greek form with article, coloured by gender
function full(x){
  const cls = x.g==="m"?"m":x.g==="f"?"f":x.g==="n"?"n":"";
  const art = x.art ? '<span class="art">'+x.art+'</span> ' : '';
  return '<span class="gr '+cls+'">'+art+esc(x.gr)+'</span>';
}
function plain(x){ return (x.art? x.art+" ":"")+x.gr; }

let view = {name:"home"};
function go(name,arg){ view={name,arg}; window.scrollTo(0,0); render(); }

function render(){
  const d = dueList().length;
  document.getElementById("dueTag").innerHTML = d ? '<b>'+d+'</b> to review' : '';
  foot.textContent = store.ok ? "Your progress is saved on this device." :
    "Private browsing: progress will not be saved after you close this tab.";
  ({home:Home,words:Words,phrases:Phrases,patterns:Patterns,
    situations:Situations,situation:Situation,review:Review,
    speak:Speak,progress:Progress}[view.name] || Home)();
}

function back(label){
  return '<button class="back" onclick="go(\'home\')">← '+ (label||"Home") +'</button>';
}

function Home(){
  const d = dueList().length;
  const started = Object.keys(P).length;
  app.innerHTML =
    '<h1>Τι θα μάθεις σήμερα;</h1>'+
    '<p class="sub">What do you want to learn today?</p>'+
    '<div class="menu">'+
      tile("Λέξεις","Words — with their article and gender","words",WORDS.length)+
      tile("Φράσεις","Phrases you can actually say","phrases",PHRASES.length)+
      tile("Μοτίβα","Patterns you can fill in yourself","patterns",PATTERNS.length)+
      tile("Καταστάσεις","Situations — bakery, café, taxi, home","situations",SITUATIONS.length)+
      tile("Επανάληψη", d ? d+" ready for review right now" : "Nothing due — start something new","review",d,d>0)+
      tile("Από μνήμης","Speak from memory: English first","speak",started)+
    '</div>'+
    '<button class="back" style="margin-top:16px" onclick="go(\'progress\')">See your progress →</button>';
}
function tile(gr,en,to,n,hot){
  return '<button class="tile'+(hot?' hot':'')+'" onclick="go(\''+to+'\')">'+
    '<span class="gr">'+gr+'</span><span class="en">'+en+'</span>'+
    (n?'<span class="n">'+n+'</span>':'')+'</button>';
}

/* ---------- words ---------- */
let wFilter="all", wQuery="", wOpen=null;
function Words(){
  const f = WORDS.filter(w=>
    (wFilter==="all"||w.pos===wFilter) &&
    (!wQuery || (w.gr+w.en).toLowerCase().includes(wQuery.toLowerCase())));
  app.innerHTML = back()+'<h1>Λέξεις</h1><p class="sub">Every noun comes with its article, so you learn the gender at the same time.</p>'+
    '<input type="search" id="q" placeholder="Search Greek or English" value="'+esc(wQuery)+'">'+
    '<div class="chips">'+
      ["all","noun","verb","adj","other"].map(k=>
        '<button class="chip" aria-pressed="'+(wFilter===k)+'" onclick="setFilter(\''+k+'\')">'+
        ({all:"All",noun:"Nouns",verb:"Verbs",adj:"Adjectives",other:"Small words"}[k])+'</button>').join("")+
    '</div>'+
    '<div class="legend"><span><b class="art" style="color:var(--m)">ο</b> masculine</span>'+
    '<span><b class="art" style="color:var(--f)">η</b> feminine</span>'+
    '<span><b class="art" style="color:var(--n)">το</b> neuter</span></div>'+
    (f.length ? f.map(itemHTML).join("") : '<div class="empty">No words match that. Try a shorter search.</div>');
  const q = document.getElementById("q");
  q.oninput = e=>{ wQuery=e.target.value; const pos=e.target.selectionStart; Words();
    const nq=document.getElementById("q"); nq.focus(); nq.setSelectionRange(pos,pos); };
}
function setFilter(k){ wFilter=k; wOpen=null; Words(); }

function itemHTML(x){
  const open = wOpen===x.id;
  let d="";
  if(open){
    d = '<div class="detail">'+
      (x.ex?'<div class="exgr">'+esc(x.ex)+'</div><div class="exen">'+esc(x.exEn)+'</div>':'')+
      (x.note?'<div class="pos">Forms: '+esc(x.note)+'</div>':'')+
      '<div class="pos">'+({noun:"noun",verb:"verb",adj:"adjective",other:"everyday word"}[x.pos]||"")+
        (x.g==="m"?" · masculine":x.g==="f"?" · feminine":x.g==="n"?" · neuter":"")+'</div>'+
      '<button class="speak" onclick="event.stopPropagation();say(\''+plain(x).replace(/'/g,"\\'")+'\')">▸ Hear it</button>'+
      '</div>';
  }
  return '<div class="item" onclick="toggle(\''+x.id+'\')">'+full(x)+
    '<div class="en">'+esc(x.en)+'</div>'+d+'</div>';
}
function toggle(id){ wOpen = wOpen===id?null:id; (view.name==="words"?Words:view.name==="phrases"?Phrases:Situation)(); }

/* ---------- phrases ---------- */
let pSit="all";
function Phrases(){
  const list = PHRASES.filter(p=>pSit==="all"||p.s===pSit);
  app.innerHTML = back()+'<h1>Φράσεις</h1><p class="sub">Whole sentences you can use today, without changing anything.</p>'+
    '<div class="chips"><button class="chip" aria-pressed="'+(pSit==="all")+'" onclick="setSit(\'all\')">All</button>'+
      SITUATIONS.filter(s=>PHRASES.some(p=>p.s===s.id)).map(s=>
        '<button class="chip" aria-pressed="'+(pSit===s.id)+'" onclick="setSit(\''+s.id+'\')">'+s.en+'</button>').join("")+
    '</div>'+ list.map(itemHTML).join("");
}
function setSit(s){ pSit=s; wOpen=null; Phrases(); }

/* ---------- patterns ---------- */
function Patterns(){
  app.innerHTML = back()+'<h1>Μοτίβα</h1>'+
    '<p class="sub">Learn one pattern and you can build a hundred sentences. Swap in any word you know.</p>'+
    PATTERNS.map(p=>
      '<div class="pat"><div class="form">'+esc(p.gr)+'<span class="slot"></span></div>'+
      '<div class="en">'+esc(p.en)+' &nbsp;·&nbsp; '+esc(p.slot)+'</div>'+
      '<ul>'+p.ex.map(e=>'<li>'+esc(e[0])+'<small>'+esc(e[1])+'</small></li>').join("")+'</ul></div>'
    ).join("");
}

/* ---------- situations ---------- */
function Situations(){
  app.innerHTML = back()+'<h1>Καταστάσεις</h1>'+
    '<p class="sub">The words and phrases you need for one place, together.</p>'+
    '<div class="menu">'+SITUATIONS.map(s=>{
      const n = ALL.filter(x=>x.tags&&x.tags.includes(s.id)).length;
      return '<button class="tile" onclick="go(\'situation\',\''+s.id+'\')">'+
        '<span class="gr">'+s.gr+'</span><span class="en">'+s.en+'</span><span class="n">'+n+'</span></button>';
    }).join("")+'</div>';
}
function Situation(){
  const s = SITUATIONS.find(x=>x.id===view.arg);
  const items = ALL.filter(x=>x.tags&&x.tags.includes(s.id));
  const words = items.filter(x=>x.kind==="word"), phr = items.filter(x=>x.kind==="phrase");
  app.innerHTML = '<button class="back" onclick="go(\'situations\')">← Situations</button>'+
    '<h1>'+s.gr+'</h1><p class="sub">'+s.en+'</p>'+
    (phr.length?'<h2>Say this</h2>'+phr.map(itemHTML).join(""):"")+
    (words.length?'<h2>Words you need</h2>'+words.map(itemHTML).join(""):"");
}

/* ---------- review ---------- */
let session=null;
function Review(){
  if(!session){
    let q = shuffle(dueList()).slice(0,20);
    if(q.length < 10) q = q.concat(newList(10-q.length));
    if(!q.length){ app.innerHTML = back()+'<h1>Επανάληψη</h1>'+
      '<div class="empty">Nothing to review and nothing new left. Come back tomorrow, or open Words to browse.</div>'; return; }
    session = {q:shuffle(q), i:0, right:0, mode:null, shown:false, picked:null};
  }
  const S=session;
  if(S.i>=S.q.length){
    app.innerHTML = back()+'<h1>Τέλος</h1>'+
      '<div class="empty">'+S.right+' of '+S.q.length+' right.<br>Next batch is scheduled.</div>'+
      '<div class="actions"><button class="btn" onclick="session=null;go(\'review\')">Review more</button>'+
      '<button class="btn ghost" onclick="session=null;go(\'home\')">Done for now</button></div>';
    return;
  }
  const x = S.q[S.i];
  if(S.mode===null){ S.mode = (!seen(x.id) || rec(x.id).box<2) ? "recognise" : "produce"; }

  if(S.mode==="recognise"){
    const wrongs = shuffle(ALL.filter(o=>o.id!==x.id && o.kind===x.kind)).slice(0,3);
    if(!S.opts) S.opts = shuffle([x].concat(wrongs));
    app.innerHTML = back()+'<h1>Επανάληψη</h1>'+
      '<div class="card"><div class="prompt">What does this mean?</div>'+
        '<div class="big">'+plainSpan(x)+'</div></div>'+
      '<div class="choices">'+S.opts.map(o=>{
        let c="choice";
        if(S.picked){ if(o.id===x.id) c+=" right"; else if(o.id===S.picked) c+=" wrong"; }
        return '<button class="'+c+'" onclick="pick(\''+o.id+'\')">'+esc(o.en)+'</button>';
      }).join("")+'</div>'+
      (S.picked?'<div class="actions"><button class="btn" onclick="next()">Next</button></div>':"")+
      counter();
  } else {
    app.innerHTML = back()+'<h1>Επανάληψη</h1>'+
      '<div class="card"><div class="prompt">Say it in Greek</div>'+
        '<div class="bigen">'+esc(x.en)+'</div>'+
        (S.shown?'<div class="big reveal">'+plainSpan(x)+'</div>'+
          (x.ex?'<div class="ex reveal">'+esc(x.ex)+'</div>':""):"")+
      '</div>'+
      (S.shown
        ? '<div class="actions two"><button class="btn again" onclick="mark(false)">Not yet</button>'+
          '<button class="btn good" onclick="mark(true)">I had it</button></div>'+
          '<div class="actions"><button class="btn ghost" onclick="say(\''+plain(x).replace(/'/g,"\\'")+'\')">▸ Hear it</button></div>'
        : '<div class="actions"><button class="btn" onclick="session.shown=true;Review()">Show the answer</button></div>')+
      counter();
  }
}
function plainSpan(x){
  const cls = x.g==="m"?"m":x.g==="f"?"f":x.g==="n"?"n":"";
  const art = x.art?'<span class="art">'+x.art+'</span> ':'';
  return '<span class="'+cls+'">'+art+esc(x.gr)+'</span>';
}
function counter(){ return '<div class="counter">'+(session.i+1)+' / '+session.q.length+'</div>'; }
function pick(id){
  if(session.picked) return;
  session.picked=id;
  const ok = id===session.q[session.i].id;
  if(ok) session.right++;
  grade(session.q[session.i].id, ok);
  Review();
}
function mark(good){ if(good) session.right++; grade(session.q[session.i].id,good); next(); }
function next(){ session.i++; session.mode=null; session.shown=false; session.picked=null; session.opts=null; Review(); }

/* ---------- speak from memory ---------- */
let sp=null;
function Speak(){
  if(!sp){
    const pool = ALL.filter(x=>seen(x.id)).length>8 ? ALL.filter(x=>seen(x.id)) : ALL;
    sp = {q:shuffle(pool).slice(0,15), i:0, shown:false};
  }
  if(sp.i>=sp.q.length){
    app.innerHTML = back()+'<h1>Από μνήμης</h1><div class="empty">That\'s the set. Say them out loud once more before you close.</div>'+
      '<div class="actions"><button class="btn" onclick="sp=null;Speak()">Another set</button></div>'; return;
  }
  const x = sp.q[sp.i];
  app.innerHTML = back()+'<h1>Από μνήμης</h1>'+
    '<p class="sub">Say the Greek out loud first. Then check.</p>'+
    '<div class="card"><div class="bigen">'+esc(x.en)+'</div>'+
      (sp.shown?'<div class="big reveal">'+plainSpan(x)+'</div>'+
        (x.ex?'<div class="ex reveal">'+esc(x.ex)+'</div>':""):"")+'</div>'+
    (sp.shown
      ? '<div class="actions two">'+
        '<button class="btn ghost" onclick="say(\''+plain(x).replace(/'/g,"\\'")+'\')">▸ Hear it</button>'+
        '<button class="btn" onclick="sp.i++;sp.shown=false;Speak()">Next</button></div>'
      : '<div class="actions"><button class="btn" onclick="sp.shown=true;Speak()">Check</button></div>')+
    '<div class="counter">'+(sp.i+1)+' / '+sp.q.length+'</div>';
}

/* ---------- progress ---------- */
function Progress(){
  const groups = [
    ["Nouns", WORDS.filter(w=>w.pos==="noun")],
    ["Verbs", WORDS.filter(w=>w.pos==="verb")],
    ["Adjectives &amp; small words", WORDS.filter(w=>w.pos==="adj"||w.pos==="other")],
    ["Phrases", PHRASES]
  ];
  const d = dueList().length;
  app.innerHTML = back()+'<h1>Πρόοδος</h1><p class="sub">Mastered means you have recalled it correctly five times, spread over weeks.</p>'+
    groups.map(([name,list])=>{
      const m = list.filter(x=>mastered(x.id)).length;
      const pct = list.length? Math.round(m/list.length*100):0;
      return '<div class="row"><div class="lab"><span>'+name+'</span><b>'+m+' / '+list.length+'</b></div>'+
        '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
    }).join("")+
    '<div class="empty" style="margin-top:22px">'+(d? d+' ready for review today.' : 'Nothing due today.')+'</div>'+
    '<div class="actions" style="margin-top:22px"><button class="btn ghost" onclick="reset()">Erase my progress</button></div>';
}
function reset(){
  if(confirm("Erase all progress on this device? This cannot be undone.")){ P={}; save(); go("home"); }
}

render();
</script>
</body>
</html>
